name: Build G57 Maze Web

on:
  push:
    branches: [main]
    paths: [g57_build/TRIGGER.txt]
  pull_request:
    branches: [main]
    paths: [g57_build/TRIGGER.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct G57 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf game dist
          mkdir -p game/audio dist
          base64 -d g57_build/g57_code_bundle.b64 > /tmp/g57_code.zip
          unzip -q /tmp/g57_code.zip -d game

      - name: Generate lightweight web audio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math, random, wave, struct, os
          os.makedirs('game/audio', exist_ok=True)
          SR=22050
          rng=random.Random(56057)
          noise=[rng.uniform(-1,1) for _ in range(SR*7)]
          def fade(i,n):
              return max(0.0,min(1.0,i/(SR*.08),(n-i)/(SR*.12)))
          def write(name,dur,fn,vol=.2):
              n=int(SR*dur)
              with wave.open('game/audio/'+name,'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR)
                  out=bytearray()
                  for i in range(n):
                      t=i/SR; x=max(-1,min(1,fn(t,i,n)*vol))
                      out += struct.pack('<h',int(x*32767))
                  w.writeframes(out)
          def ambient(f):
              return lambda t,i,n:.55*math.sin(2*math.pi*f*t)+.28*math.sin(2*math.pi*f*1.51*t)+.14*math.sin(2*math.pi*.19*t)
          write('ambience_floor1.wav',5,ambient(54),.10)
          write('ambience_floor2.wav',5,ambient(47),.105)
          write('ambience_floor3.wav',5,ambient(41),.11)
          def spooky(t,i,n):
              pulse=.35+.65*(.5+.5*math.sin(2*math.pi*.23*t))
              return (.72*math.sin(2*math.pi*38*t)+.35*math.sin(2*math.pi*57.3*t)+noise[i]*.24)*pulse
          write('spooky_zone.wav',7,spooky,.13)
          def chirp(a,b,d):
              return lambda t,i,n: math.sin(2*math.pi*(a*t+(b-a)*t*t/(2*d)))*fade(i,n)
          write('jump.wav',.25,chirp(290,520,.25),.22)
          write('trap_hit.wav',.38,lambda t,i,n:(math.sin(2*math.pi*82*t)+noise[i%len(noise)]*.65)*fade(i,n),.27)
          write('pickup.wav',.32,chirp(520,980,.32),.22)
          write('correct.wav',.48,lambda t,i,n:(math.sin(2*math.pi*660*t)+.55*math.sin(2*math.pi*880*t))*fade(i,n),.20)
          write('door_open.wav',.60,chirp(115,72,.60),.24)
          write('floor_up.wav',.72,chirp(330,740,.72),.21)
          write('victory.wav',1.35,lambda t,i,n:(math.sin(2*math.pi*(440 if t<.45 else 554 if t<.9 else 659)*t)+.35*math.sin(2*math.pi*880*t))*fade(i,n),.19)
          PY

      - name: Create Web export preset
        shell: bash
        run: |
          cat > game/export_presets.cfg <<'EOF2'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          advanced_options=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../dist/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=true
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=true
          progressive_web_app/enabled=false
          progressive_web_app/ensure_cross_origin_isolation_headers=false
          progressive_web_app/offline_page=""
          progressive_web_app/display=0
          progressive_web_app/orientation=1
          progressive_web_app/icon_144x144=""
          progressive_web_app/icon_180x180=""
          progressive_web_app/icon_512x512=""
          progressive_web_app/background_color=Color(0, 0, 0, 1)
          EOF2

      - name: Install Godot 4.7.1 and Web templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q -O /tmp/godot.zip https://godot-releases.nbg1.your-objectstorage.com/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN=$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -1)
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          wget -q -O /tmp/templates.tpz https://godot-releases.nbg1.your-objectstorage.com/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p /tmp/templates-unpack "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates-unpack
          cp -a /tmp/templates-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          "$GODOT_BIN" --version

      - name: Import and export G57 Web
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path game --import
          "$GODOT_BIN" --headless --path game --export-release Web "$(pwd)/dist/index.html"
          test -f dist/index.html
          test -f dist/index.pck
          test -f dist/index.wasm
          ls -lh dist

      - name: Upload G57 Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: G57-Web-Build
          path: dist/
          if-no-files-found: error

      - name: Publish under /maze
        shell: bash
        run: |
          set -euo pipefail
          rm -rf maze
          mkdir -p maze
          cp -a dist/. maze/
          touch .nojekyll
          git config user.name "G57 Web Builder"
          git config user.email "actions@users.noreply.github.com"
          git add maze .nojekyll
          git commit -m "Deploy G57 maze web" || true
          git push origin HEAD:main
